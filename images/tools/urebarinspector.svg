  <path d="M21 21 28 28" fill="none" stroke="#FF8100" stroke-width="1.5" stroke-linecap="square"/>
  <circle cx="20" cy="16" r="7" fill="#FFFFFF" stroke="#363545" stroke-width="2"/>
  <circle cx="20" cy="16" r="4.5" fill="#D7D9E0"/>
  <!-- One bar highlighted inside the lens -->
  <path d="M20 12V20" stroke="#FF8100" stroke-width="2"/>
</svg>
