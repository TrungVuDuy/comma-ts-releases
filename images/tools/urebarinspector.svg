<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Rebar Inspector</title>
  <!-- Three clear reinforcing bars with a stirrup -->
  <path d="M5 5V25 M11 5V25 M17 5V25" fill="none" stroke="#363545" stroke-width="2.5"/>
  <path d="M4 9H18 M4 16H18 M4 23H18" fill="none" stroke="#81818D" stroke-width="1.5"/>
  <!-- Magnifier: the large lens and handle make the inspection action legible at catalog size. -->
