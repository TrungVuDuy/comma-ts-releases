     r="6.0724888"
     id="circle2"
     style="stroke-width:1.2145;fill:#71a141" /><polygon
     class="orange"
     points="42,54 39,64 37,64 34,54 "
     id="polygon2"
     transform="matrix(1.2144978,0,0,1.2144978,4.2780792,-2.0980377)"
